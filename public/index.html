<script>
  // ─── CONFIG ──────────────────────────────────────────────
  //const NOTION_TOKEN = 'ntn_P6580596269718Be0XaIU6xkqBVdkXydONHr83avsF9gq1';
  //const DB_RESULTS = '14a856233306423b860a2873d2ab9b90';
  //const DB_UPCOMING = 'a6a74510b98b4966b9863a20fbb5228a';
  //const DB_PLAYERS = 'f2a652efcc144b00848dc71ccda9d273';
  // ─────────────────────────────────────────────────────────

  const CROSS = new Set(['Cam Spencer', "Royce O'Neale", 'Shaedon Sharpe', 'Tim Hardaway Jr.']);

  const CFG = {
    'Satoshi DAO': {
      label: 'Satoshi DAO', sub: 'BδB', badge: 'badge-bdb',
      cols: ['pts', 'reb', 'ast', 'blk', 'stl', 'three_pm', 'to', 'fg_pct', 'ft_pct'],
      headers: ['PTS', 'REB', 'AST', 'BLK', 'ST', '3PTM', 'TO', 'FG%', 'FT%'],
      thresh: {
        pts: { hi: 18, lo: 10 }, reb: { hi: 7, lo: 4 }, ast: { hi: 5, lo: 3 },
        blk: { hi: 1.5, lo: 0.5 }, stl: { hi: 1.5, lo: 0.5 }, three_pm: { hi: 2.5, lo: 1 },
        to: { hi: 1, lo: 3, inv: true }, fg_pct: { hi: 0.48, lo: 0.40 }, ft_pct: { hi: 0.80, lo: 0.65 }
      }
    },
    'Piraeus Newbies': {
      label: 'Piraeus Newbies', sub: 'LDL', badge: 'badge-ldl',
      cols: ['pts', 'dreb', 'oreb', 'ast', 'blk', 'stl', 'three_pm', 'to', 'a_to', 'fg_pct', 'ft_pct'],
      headers: ['PTS', 'DREB', 'OREB', 'AST', 'BLK', 'ST', '3PTM', 'TO', 'A/TO', 'FG%', 'FT%'],
      thresh: {
        pts: { hi: 18, lo: 10 }, dreb: { hi: 5, lo: 3 }, oreb: { hi: 2, lo: 0.5 },
        ast: { hi: 5, lo: 3 }, blk: { hi: 1.5, lo: 0.5 }, stl: { hi: 1.5, lo: 0.5 },
        three_pm: { hi: 2.5, lo: 1 }, to: { hi: 1, lo: 3, inv: true }, a_to: { hi: 3.0, lo: 1.5 },
        fg_pct: { hi: 0.48, lo: 0.40 }, ft_pct: { hi: 0.80, lo: 0.65 }
      }
    }
  };

  async function queryNotion(dbId, filter) {
    const endpoints = {
      '14a856233306423b860a2873d2ab9b90': '/api/results',
      'a6a74510b98b4966b9863a20fbb5228a': '/api/upcoming',
      'f2a652efcc144b00848dc71ccda9d273': '/api/players'
    };
    const r = await fetch(endpoints[dbId]);
    return await r.json();
  }

  function prop(page, key, type) {
    const p = page.properties?.[key];
    if (!p) return null;
    switch (type) {
      case 'title': return p.title?.[0]?.plain_text || null;
      case 'text': return p.rich_text?.[0]?.plain_text || null;
      case 'number': return p.number ?? null;
      case 'select': return p.select?.name || null;
      case 'date': return p.date?.start || null;
    }
    return null;
  }

  function todayFilter() {
    return {
      property: 'date',
      date: { equals: new Date().toISOString().split('T')[0] }
    };
  }

  function cls(key, val, thresh) {
    if (val === null || val === undefined) return '';
    const t = thresh[key]; if (!t) return '';
    const v = parseFloat(val);
    if (t.inv) return v <= t.hi ? 'hi' : v >= t.lo ? 'lo' : 'mid';
    return v >= t.hi ? 'hi' : v <= t.lo ? 'lo' : 'mid';
  }

  function fmt(key, val) {
    if (val === null || val === undefined) return '–';
    if (key === 'fg_pct' || key === 'ft_pct')
      return (parseFloat(val) * 100).toFixed(1) + '%';
    if (key === 'a_to') return parseFloat(val).toFixed(1);
    return Number.isInteger(val) ? val : parseFloat(val).toFixed(1);
  }

  function catScore(players, leagueKey) {
    const cfg = CFG[leagueKey];
    let wins = 0, losses = 0, ties = 0;
    cfg.cols.forEach(col => {
      const played = players.filter(p => p.status === 'played' && p[col] !== null);
      if (!played.length) return;
      const avg = played.reduce((s, p) => s + parseFloat(p[col] || 0), 0) / played.length;
      const t = cfg.thresh[col]; if (!t) return;
      const mid = (t.hi + t.lo) / 2;
      const good = t.inv ? avg <= mid : avg >= mid;
      const bad = t.inv ? avg >= mid : avg <= mid;
      if (good) wins++; else if (bad) losses++; else ties++;
    });
    return { wins, losses, ties };
  }

  function renderRow(p, cfg, _, extraClass = '') {
    const isCross = CROSS.has(p.player);
    const name = `${isCross ? '<span class="cross-dot"></span>' : ''}${p.player}<span class="pos-tag">${p.team || ''}</span>`;
    if (extraClass === 'ng-row')
      return `<tr class="ng-row"><td>${name}</td>${cfg.cols.map(() => '<td>–</td>').join('')}</tr>`;
    if (extraClass === 'dnp-row')
      return `<tr class="dnp-row"><td>${name}</td>${cfg.cols.map(() => '<td>DNP</td>').join('')}</tr>`;
    if (!p.a_to && cfg.cols.includes('a_to')) {
      const a = parseFloat(p.ast || 0), t = parseFloat(p.to || 0);
      p.a_to = t === 0 ? a : parseFloat((a / t).toFixed(2));
    }
    const cells = cfg.cols.map(col =>
      `<td class="${cls(col, p[col], cfg.thresh)}">${fmt(col, p[col])}</td>`
    ).join('');
    return `<tr><td>${name}</td>${cells}</tr>`;
  }

  function renderLeague(players, leagueKey) {
    const cfg = CFG[leagueKey];
    const played = players.filter(p => p.status === 'played').sort((a, b) => (b.pts || 0) - (a.pts || 0));
    const dnp = players.filter(p => p.status === 'DNP');
    const noGame = players.filter(p => p.status === 'no_game');
    const score = catScore(played, leagueKey);
    const rows = [
      ...played.map(p => renderRow(p, cfg, '')),
      ...dnp.map(p => renderRow(p, cfg, 'dnp-row')),
      ...noGame.map(p => renderRow(p, cfg, 'ng-row')),
    ];
    return `
      <div class="league-panel">
        <div class="league-header">
          <div>
            <div class="league-name">${cfg.label}</div>
            <div class="league-meta">${cfg.cols.length} H2H categories</div>
          </div>
          <span class="league-badge ${cfg.badge}">${cfg.sub}</span>
        </div>
        ${played.length > 0 ? `
        <div class="win-count">
          <span>Today's cats</span>
          <span>
            <span class="win-num">▲${score.wins}</span> &nbsp;
            <span class="tie-num">–${score.ties}</span> &nbsp;
            <span class="loss-num">▼${score.losses}</span>
          </span>
        </div>`: ''}
        <div style="overflow-x:auto">
          <table class="ptable">
            <thead><tr>
              <th>Player</th>
              ${cfg.headers.map(h => `<th>${h}</th>`).join('')}
            </tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        </div>
        <div class="legend">
          <span><span class="cross-dot"></span>Both rosters</span>
          <span style="color:#4ade80">● Above threshold</span>
          <span style="color:#f87171">● Below threshold</span>
        </div>
      </div>`;
  }

  function mapPlayer(page) {
    return {
      player: prop(page, 'player', 'title'),
      team: prop(page, 'team', 'text'),
      league: prop(page, 'league', 'select'),
      status: prop(page, 'status', 'select'),
      pts: prop(page, 'pts', 'number'),
      reb: prop(page, 'reb', 'number'),
      dreb: prop(page, 'dreb', 'number'),
      oreb: prop(page, 'oreb', 'number'),
      ast: prop(page, 'ast', 'number'),
      blk: prop(page, 'blk', 'number'),
      stl: prop(page, 'stl', 'number'),
      three_pm: prop(page, 'three_pm', 'number'),
      to: prop(page, 'to', 'number'),
      a_to: prop(page, 'a_to', 'number'),
      fg_pct: prop(page, 'fg_pct', 'number'),
      ft_pct: prop(page, 'ft_pct', 'number'),
      minutes: prop(page, 'minutes', 'number'),
    };
  }

  function renderPlayers(pages) {
    const players = pages.map(mapPlayer).filter(p => p.player);
    if (!players.length)
      return '<div class="loading" style="padding:2rem 0">No player data yet — run the routine first.</div>';
    const bdb = players.filter(p => p.league === 'Satoshi DAO' || p.league === 'BOTH');
    const ldl = players.filter(p => p.league === 'Piraeus Newbies' || p.league === 'BOTH');
    return `<div class="leagues-grid">
      ${renderLeague(bdb, 'Satoshi DAO')}
      ${renderLeague(ldl, 'Piraeus Newbies')}
    </div>`;
  }

  function renderResults(pages) {
    if (!pages.length) return '<div class="loading">No results yet.</div>';
    return pages.map(page => {
      const home = prop(page, 'home', 'text');
      const away = prop(page, 'away', 'text');
      const hs = prop(page, 'home_score', 'number');
      const as_ = prop(page, 'away_score', 'number');
      const label = prop(page, 'game_label', 'text');
      const series = prop(page, 'series_status', 'text');
      const hw = hs > as_;
      return `<div class="game-row">
        <div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:3px">
            <span class="${hw ? 'winner' : 'loser'}">${home}</span>
            <span style="display:flex;gap:5px;font-weight:600">
              <span class="${hw ? 'winner' : 'loser'}">${hs}</span>
              <span style="color:#222">–</span>
              <span class="${!hw ? 'winner' : 'loser'}">${as_}</span>
            </span>
            <span class="${!hw ? 'winner' : 'loser'}">${away}</span>
          </div>
          ${series ? `<div class="meta">${series}</div>` : ''}
        </div>
        <span class="meta">${label || ''}</span>
      </div>`;
    }).join('');
  }

  function renderUpcoming(pages) {
    if (!pages.length) return '<div class="loading">No upcoming games.</div>';
    return pages.slice(0, 6).map(page => {
      const home = prop(page, 'home', 'text');
      const away = prop(page, 'away', 'text');
      const hp = prop(page, 'home_prob', 'number') || 50;
      const label = prop(page, 'game_label', 'text');
      const time = prop(page, 'time_eest', 'text');
      const series = prop(page, 'series_status', 'text');
      const fav = hp > 50 ? home : away;
      const prob = Math.round(Math.max(hp, 100 - hp));
      return `<div class="upcoming-row">
        <div style="display:flex;justify-content:space-between;font-size:.875rem;margin-bottom:4px">
          <span>${home} <span style="color:#333">vs</span> ${away}</span>
          <span style="color:#333;font-size:.72rem;background:#141414;padding:2px 6px;border-radius:4px">${label || ''}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span class="meta">${time || ''} EEST</span>
          <span class="meta">${fav} ${prob}% fav</span>
        </div>
        <div class="prob-bar"><div class="prob-fill" style="width:${hp}%"></div></div>
        ${series ? `<div class="meta" style="margin-top:4px">${series}</div>` : ''}
      </div>`;
    }).join('');
  }

  function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector(`.tab[onclick="showTab('${tab}')"]`).classList.add('active');
    document.getElementById(`view-${tab}`).classList.add('active');
  }

  async function loadAll() {
    document.getElementById('last-updated').textContent = 'Loading…';
    try {
      const f = todayFilter();
      const [results, upcoming, players] = await Promise.all([
        queryNotion(DB_RESULTS, f),
        queryNotion(DB_UPCOMING, f),
        queryNotion(DB_PLAYERS, f)
      ]);
      document.getElementById('results').innerHTML = renderResults(results);
      document.getElementById('upcoming').innerHTML = renderUpcoming(upcoming);
      document.getElementById('players-content').innerHTML = renderPlayers(players);
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('el-GR', { timeZone: 'Europe/Athens' }) + ' EEST';
    } catch (e) {
      console.error(e);
      document.getElementById('results').innerHTML =
        '<div class="loading">Error — check token and DB IDs in console.</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', loadAll);
</script>
